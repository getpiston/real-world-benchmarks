name: "Java: Spring Framework"

# Spring Framework's own pull request build, `./gradlew check antora`, at a fixed commit, on both runners. Its build
# action sets up Java 25 and Gradle, whose cache is GitHub's.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Forks' pull requests never reach either runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, piston-4cpu-ubuntu-2402]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out Spring Framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spring-projects/spring-framework
          ref: 07c005fc2c004a99c790b59d2e4236ae6027c3ef
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build

  compare:
    name: Compare
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write the comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime

          def seconds(item):
              if not item.get("started_at") or not item.get("completed_at"):
                  return None
              start = datetime.fromisoformat(item["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(item["completed_at"].replace("Z", "+00:00"))
              return (end - start).total_seconds()

          def clock(value):
              return "–" if value is None else f"{int(value // 60)}m {int(value % 60):02d}s"

          jobs = [job for job in json.load(open("jobs.json"))["jobs"] if job["name"] != "Compare"]
          rows = []
          for job in jobs:
              build = next((step for step in job.get("steps", []) if step["name"] == "Build"), {})
              cache = sum(seconds(step) or 0 for step in job.get("steps", []) if "cache" in step["name"].lower())
              rows.append((job["name"], job["conclusion"], seconds(job), seconds(build), cache))

          print("| Runner | Result | Whole job | Build step | Cache steps |")
          print("|---|---|---:|---:|---:|")
          for name, conclusion, whole, build, cache in rows:
              print(f"| `{name}` | {conclusion} | {clock(whole)} | {clock(build)} | {clock(cache)} |")
          by_name = {row[0]: row for row in rows}
          hosted, piston = by_name.get("ubuntu-latest"), by_name.get("piston-4cpu-ubuntu-2402")
          if hosted and piston and hosted[2] and piston[2]:
              print(f"\nPiston finished the whole job {hosted[2] / piston[2]:.1f}× as fast as `ubuntu-latest`.")
          PYTHON
