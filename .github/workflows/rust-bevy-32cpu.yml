name: "Rust: Bevy, piston-32cpu"

# Bevy's own Linux CI job, `cargo run -p ci -- test`, at a fixed commit, on each runner, built from scratch with no cache.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bevy's CI settings.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"

jobs:
  build:
    # Forks' pull requests never reach either runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, piston-32cpu-ubuntu-2402]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Describe the runner
        run: |
          echo "CPUs: $(nproc)"
          free -h | sed -n 2p
          df -h / | sed -n 2p
          echo "PATH: $PATH"
          for tool in rustup cargo java node pnpm; do echo "$tool: $(command -v $tool || echo not on PATH)"; done
          ls -d "$HOME/.cargo/bin" "$HOME/.rustup" /etc/skel/.cargo/bin 2>&1 || true

      - name: Check out Bevy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bevyengine/bevy
          ref: 159fa8d8e5e11ba0d40f55e39986992520635f4f
          persist-credentials: false

      # Bevy's build needs more disk than the image leaves free. Both runners boot GitHub's image, so both drop the same SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | sed -n 2p

      # Bevy's toolchain step expects rustup on the PATH, as GitHub's image has it.
      - name: Put rustup on the PATH
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust
        uses: ./.github/actions/install-rust

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Build
        run: cargo run -p ci -- test

  compare:
    name: Compare
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write the comparison
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub's standard runner has 2 CPUs in a private repository and 4 in a public one.
          HOSTED_CPUS: ${{ github.event.repository.private && '2' || '4' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime

          def seconds(item):
              if not item.get("started_at") or not item.get("completed_at"):
                  return None
              start = datetime.fromisoformat(item["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(item["completed_at"].replace("Z", "+00:00"))
              return (end - start).total_seconds()

          def clock(value):
              return "–" if value is None else f"{int(value // 60)}m {int(value % 60):02d}s"

          jobs = [job for job in json.load(open("jobs.json"))["jobs"] if job["name"] != "Compare"]
          rows = []
          for job in jobs:
              build = next((step for step in job.get("steps", []) if step["name"] == "Build"), {})
              cache_steps = [step for step in job.get("steps", []) if "cache" in step["name"].lower()]
              cache = sum(seconds(step) or 0 for step in cache_steps) if cache_steps else None
              rows.append((job["name"], job["conclusion"], seconds(job), seconds(build), cache))

          import os

          def cpus(name):
              return int(os.environ["HOSTED_CPUS"]) if name == "ubuntu-latest" else int(name.split("-")[1].removesuffix("cpu"))

          rows.sort(key=lambda row: (row[0] != "ubuntu-latest", cpus(row[0])))
          print("| Runner | CPUs | Result | Whole job | Build step | Cache steps |")
          print("|---|---:|---|---:|---:|---:|")
          for name, conclusion, whole, build, cache in rows:
              print(f"| `{name}` | {cpus(name)} | {conclusion} | {clock(whole)} | {clock(build)} | {clock(cache)} |")
          hosted = next((row for row in rows if row[0] == "ubuntu-latest"), None)
          if hosted and hosted[1] == "success":
              print()
              for name, conclusion, whole, _, _ in rows:
                  if name == "ubuntu-latest" or conclusion != "success":
                      continue
                  match = "the same CPUs" if cpus(name) == cpus("ubuntu-latest") else f"{cpus(name)} CPUs against {cpus('ubuntu-latest')}"
                  print(f"- `{name}` finished the whole job {hosted[2] / whole:.1f}× as fast as `ubuntu-latest` ({match}).")
          PYTHON
