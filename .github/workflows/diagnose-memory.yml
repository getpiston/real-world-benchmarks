name: "Diagnostics: memory and swap"

# What each runner gives a job in memory and swap, and what happens when a job asks for more than its RAM.
on:
  push:
    branches: [diagnose-memory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, piston-2cpu-ubuntu-2402, piston-4cpu-ubuntu-2402]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Memory and swap settings
        run: |
          echo "CPUs: $(nproc)"
          free -h
          echo "--- swap areas"
          swapon --show --bytes || true
          echo "--- /proc/meminfo"
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree|CommitLimit|Committed_AS):' /proc/meminfo
          echo "--- kernel settings"
          for setting in vm.swappiness vm.overcommit_memory vm.overcommit_ratio vm.min_free_kbytes vm.watermark_scale_factor vm.vfs_cache_pressure; do sysctl "$setting" || true; done
          echo "--- this job's cgroup"
          cat /proc/self/cgroup
          for file in memory.max memory.high memory.swap.max; do echo "$file: $(cat /sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/$file 2>/dev/null || echo none)"; done
          echo "--- out-of-memory daemons"
          for unit in systemd-oomd earlyoom; do echo "$unit: $(systemctl is-active $unit 2>/dev/null || true)"; done
          echo "--- Node's default heap limit"
          node -e 'console.log(Math.round(require("v8").getHeapStatistics().heap_size_limit / 1048576) + " MiB")'
          echo "--- kernel"
          uname -r

      - name: The runner's processes under memory pressure
        run: |
          ps -eo pid,ppid,user,rss,comm --sort=-rss | head -12
          echo "--- kill priority (oom_score_adj; -1000 is never killed)"
          for pid in $(pgrep -f 'Runner.Listener|Runner.Worker|runsvc|piston|entrypoint|provisioner|hosted-compute'); do
            printf '%-7s score=%-5s adj=%-6s %s\n' "$pid" "$(cat /proc/$pid/oom_score 2>/dev/null)" "$(cat /proc/$pid/oom_score_adj 2>/dev/null)" "$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null | cut -c1-110)"
          done

      - name: Write the memory filler
        run: |
          cat > "$RUNNER_TEMP/fill.py" <<'PYTHON'
          # Grows by 256 MiB, every page written, until the kernel stops it; logs each step.
          import time

          def meminfo():
              values = {}
              for line in open("/proc/meminfo"):
                  key, value = line.split(":")
                  values[key] = int(value.split()[0]) * 1024
              return values

          gib = 1 << 30
          step = 256 << 20
          info = meminfo()
          print(f"RAM {info['MemTotal'] / gib:.2f} GiB, swap {info['SwapTotal'] / gib:.2f} GiB", flush=True)
          held = []
          start = time.time()
          while True:
              block = bytearray(step)
              block[::4096] = b"\x01" * (step // 4096)
              held.append(block)
              now = meminfo()
              used_swap = (now["SwapTotal"] - now["SwapFree"]) / gib
              print(f"held {len(held) * step / gib:6.2f} GiB at {time.time() - start:6.1f}s: available {now['MemAvailable'] / gib:5.2f} GiB, swap used {used_swap:5.2f} GiB", flush=True)
          PYTHON

      - name: Grow one process until something gives
        continue-on-error: true
        run: |
          set +e
          python3 "$RUNNER_TEMP/fill.py"
          echo "The filler ended with exit code $?"
          echo "--- the kernel's account"
          sudo dmesg | grep -iE 'out of memory|oom-kill|killed process|oom_reaper' | tail -8
          free -h
          exit 0

      - name: Did the runner survive
        if: always()
        run: |
          echo "This step ran, so the runner survived."
          uptime
          free -h
