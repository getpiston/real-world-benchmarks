name: "JavaScript: VS Code"

# VS Code's own pull request compile at a fixed commit, on both runners: install with pnpm, then the checks and
# compiles its CI runs. pnpm's store and the built-in extensions are kept in GitHub's cache.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Forks' pull requests never reach either runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, piston-4cpu-ubuntu-2402]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Describe the runner
        run: |
          echo "CPUs: $(nproc)"
          free -h | sed -n 2p
          df -h / | sed -n 2p
          echo "PATH: $PATH"
          for tool in rustup cargo java node pnpm; do echo "$tool: $(command -v $tool || echo not on PATH)"; done
          ls -d "$HOME/.cargo/bin" "$HOME/.rustup" /etc/skel/.cargo/bin 2>&1 || true

      - name: Check out VS Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vscode
          ref: 90ca413deb758b0b07058d6401c2608423635eb3
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: vscode-${{ matrix.runner }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: vscode-${{ matrix.runner }}-pnpm-

      - name: Install build tools
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install Electron headers
        run: pnpm run preinstall

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Prepare the built-in extensions cache key
        run: mkdir -p .build && node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore the built-in extensions cache
        id: builtin-extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/builtInExtensions
          key: vscode-${{ matrix.runner }}-builtin-extensions-${{ hashFiles('.build/builtindepshash') }}

      - name: Download built-in extensions
        if: steps.builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm exec npm-run-all2 -lp core-ci-pr valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compare:
    name: Compare
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write the comparison
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub's standard runner has 2 CPUs in a private repository and 4 in a public one.
          HOSTED_CPUS: ${{ github.event.repository.private && '2' || '4' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime

          def seconds(item):
              if not item.get("started_at") or not item.get("completed_at"):
                  return None
              start = datetime.fromisoformat(item["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(item["completed_at"].replace("Z", "+00:00"))
              return (end - start).total_seconds()

          def clock(value):
              return "–" if value is None else f"{int(value // 60)}m {int(value % 60):02d}s"

          jobs = [job for job in json.load(open("jobs.json"))["jobs"] if job["name"] != "Compare"]
          rows = []
          for job in jobs:
              build = next((step for step in job.get("steps", []) if step["name"] == "Build"), {})
              cache_steps = [step for step in job.get("steps", []) if "cache" in step["name"].lower()]
              cache = sum(seconds(step) or 0 for step in cache_steps) if cache_steps else None
              rows.append((job["name"], job["conclusion"], seconds(job), seconds(build), cache))

          import os

          def cpus(name):
              return int(os.environ["HOSTED_CPUS"]) if name == "ubuntu-latest" else int(name.split("-")[1].removesuffix("cpu"))

          rows.sort(key=lambda row: (row[0] != "ubuntu-latest", cpus(row[0])))
          print("| Runner | CPUs | Result | Whole job | Build step | Cache steps |")
          print("|---|---:|---|---:|---:|---:|")
          for name, conclusion, whole, build, cache in rows:
              print(f"| `{name}` | {cpus(name)} | {conclusion} | {clock(whole)} | {clock(build)} | {clock(cache)} |")
          hosted = next((row for row in rows if row[0] == "ubuntu-latest"), None)
          if hosted and hosted[1] == "success":
              print()
              for name, conclusion, whole, _, _ in rows:
                  if name == "ubuntu-latest" or conclusion != "success":
                      continue
                  match = "the same CPUs" if cpus(name) == cpus("ubuntu-latest") else f"{cpus(name)} CPUs against {cpus('ubuntu-latest')}"
                  print(f"- `{name}` finished the whole job {hosted[2] / whole:.1f}× as fast as `ubuntu-latest` ({match}).")
          PYTHON
